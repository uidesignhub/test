<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sign Up | Grainchaff</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="" name="description" />
    <meta content="" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <!-- Bootstrap css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

    <!-- main css-->
    <link href="assets/css/main.css" id="theme-style" rel="stylesheet" type="text/css" />

</head>

<body class="bg-white">
    <div class="d-flex align-items-center min-vh-100">
        <div class="container-fluid p-0">
            <div class="row g-0">
                <div class="col-xxl-6 col-lg-6 col-md-6 d-none d-sm-block">
                    <div class="bg-primary auth-bg bg-cover d-flex flex-column h-100 p-5">
                        <div class="z-1 px-5">
                            <figure>
                                <blockquote class="blockquote">
                                  <h4 class="text-secondary f-600">It’s a survey of the community to see who’s interested and who has ideas..</h4>
                                  <p class="text-white">It’s a pretty conventional way of doing it.</p> 
                                </blockquote>
                                <figcaption class="blockquote-footer text-white-50">
                                 <cite title="Source Title">-Steve Brown</cite>
                                </figcaption>
                              </figure>
                            <div>
                        </div>
                      </div>
                    </div>
                </div>
                <div class="col-xxl-6 col-lg-6 col-md-6">
                    <div class="vh-100 bg-white py-md-5 p-4 d-flex overflow-scroll">
                        <div class="row justify-content-center g-0 align-items-center w-100">
                            <div class="col-xl-8 col-lg-8">
                                <div class="card">
                                    <div class="card-body px-0">
                                        <div class="px-sm-3 py-sm-3">
                                            <a href="signin.html">
                                                <img src="assets/images/logo.svg" alt="" height="48" class="mb-3">
                                            </a>
                                            <div class="">
                                                <h5 class="mb-0 f-600">Sign Up</h5>
                                                <p class="text-muted mt-2">Use your phone or other serivce to continue with us  </p>
                                            </div>
                                            <form class="my-4 pt-2">
                                                <div class="form-floating form-floating-custom mb-3">
                                                    <input type="text" class="form-control" id="input-username" placeholder="Enter User Name">
                                                    <label for="input-username">Name</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3">
                                                    <input type="text" class="form-control" id="input-email" placeholder="Enter User Email">
                                                    <label for="input-email">Email</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3">
                                                    <input type="text" class="form-control" id="input-mobile" placeholder="Enter User Mobile">
                                                    <label for="input-mobile">Mobile Number</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3">
                                                    <input type="text" class="form-control" id="input-company" placeholder="Enter User Company">
                                                    <label for="input-company">Company</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3 auth-pass-inputgroup">
                                                    <input type="password" class="form-control" id="password-input" placeholder="Enter Password">
                                                    <button type="button" class="btn btn-link position-absolute h-100 end-0 top-0" id="password-addon">
                                                        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" class="lucide lucide-eye h-20 text-muted"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg> -->
                                                        <i data-lucide="eye"></i>
                                                    </button>
                                                    <label for="password-input">Password</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3 auth-pass-inputgroup">
                                                    <input type="password" class="form-control" id="password-input" placeholder="Enter Password">
                                                    <button type="button" class="btn btn-link position-absolute h-100 end-0 top-0" id="password-addon">
                                                        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" class="lucide lucide-eye h-20 text-muted"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg> -->
                                                        <i data-lucide="eye-off"></i>
                                                    </button>
                                                    <label for="password-input">Confirm Password</label>
                                                </div>
                                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                                    <div class="form-check form-check-primary  py-1">
                                                        <input class="form-check-input" type="checkbox" id="remember-check">
                                                        <label class="form-check-label ms-2" for="remember-check">
                                                            I have read and agree to the <a href="">Terms Use</a> and <a href="">Privacy Policy</a>
                                                        </label>
                                                    </div>
                                                
                                                </div>
                                                <div class="">
                                                    <button class="btn btn-secondary w-100" type="submit">Log In</button>
                                                </div>
                                            </form>
                                            <div class="d-flex justify-content-around align-items-center">
                                                <hr class="flex-fill">
                                                <div class="mx-4 text-muted">
                                                  Or Continue With
                                                </div>
                                                <hr class="flex-fill">
                                            </div>
                                            <div class="d-flex align-items-center gap-3 my-3">
                                                <button class="btn btn-outline-light w-100">
                                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-5 me-3"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
                                                    Google
                                                </button>
                                                <button class="btn btn-outline-light w-100">
                                                    <svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 40 40" class="me-3 w-4"><linearGradient id="a" x1="-277.375" x2="-277.375" y1="406.602" y2="407.573" gradientTransform="matrix(40 0 0 -39.7778 11115.001 16212.334)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0062e0"/><stop offset="1" stop-color="#19afff"/></linearGradient><path fill="url(#a)" d="M16.7 39.8C7.2 38.1 0 29.9 0 20 0 9 9 0 20 0s20 9 20 20c0 9.9-7.2 18.1-16.7 19.8l-1.1-.9h-4.4z"/><path fill="#fff" d="m27.8 25.6.9-5.6h-5.3v-3.9c0-1.6.6-2.8 3-2.8H29V8.2c-1.4-.2-3-.4-4.4-.4-4.6 0-7.8 2.8-7.8 7.8V20h-5v5.6h5v14.1q1.65.3 3.3.3t3.3-.3V25.6z"/></svg>
                                                    Facebook
                                                </button>
                                            </div>
                                            <footer class="text-center">
                                                <p class="text-muted mb-0">Already have an account? <a href="signin.html" class="ms-1"><b>Login</b></a></p>
                                            </footer>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- JAVASCRIPT -->
    <script src="assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- lucide icon js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
