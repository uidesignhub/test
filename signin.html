<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Sign In | Grainchaff</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="" name="description" />
    <meta content="" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <!-- Bootstrap css -->
    <link href="assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />

    <!-- main css-->
    <link href="assets/css/main.css" id="theme-style" rel="stylesheet" type="text/css" />

</head>
<body class="bg-white">
    <div class="d-flex align-items-center min-vh-100">
        <div class="container-fluid p-0">
            <div class="row g-0">
                <div class="col-xxl-6 col-lg-6 col-md-6">
                    <div class=" auth-bg bg-cover d-flex flex-column h-100 p-5">
                        <div class="bg-overlay overlay-primary"></div>
                        <div class="mt-auto z-1 pe-5">
                            <figure>
                                <blockquote class="blockquote">
                                  <p class="mb-0 text-secondary f-600">It’s a survey of the community to see who’s interested and who has ideas..</p>
                                  <h6 class="text-white">It’s a pretty conventional way of doing it.</h6> 
                                </blockquote>
                                <figcaption class="blockquote-footer text-white-50">
                                 <cite title="Source Title">-Steve Brown</cite>
                                </figcaption>
                              </figure>
                            <div>
                        </div>
                        <div class="mt-3">
                            <p class="mb-0 text-muted">© <script>document.write(new Date().getFullYear())</script> Mforge</p>
                    </div>
                        </div>
                      
                    </div>
                </div>
                <div class="col-xxl-6 col-lg-6 col-md-6">
                    <div class="vh-100 bg-white py-md-5 p-4 d-flex">
                        <div class="row justify-content-center g-0 align-items-center w-100">
                            <div class="col-xl-8 col-lg-8">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="px-3 py-3">
                                            <a href="signin.html">
                                                <img src="assets/images/logo.svg" alt="" height="48" class="mb-3">
                                            </a>
                                            <div class="">
                                                <h5 class="mb-0 f-600">Login</h5>
                                                <p class="text-muted mt-2">Use your phone or other serivce to continue with us  </p>
                                            </div>
                                            <form class="my-4 pt-2">
                                                <div class="form-floating form-floating-custom mb-3">
                                                    <input type="text" class="form-control" id="input-username" placeholder="Enter User Name">
                                                    <label for="input-username">Username/Email</label>
                                                </div>
                                                <div class="form-floating form-floating-custom mb-3 auth-pass-inputgroup">
                                                    <input type="password" class="form-control" id="password-input" placeholder="Enter Password">
                                                    <button type="button" class="btn btn-link position-absolute h-100 end-0 top-0" id="password-addon">
                                                        <!-- <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" class="lucide lucide-eye h-20 text-muted"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg> -->
                                                        <i data-lucide="eye"></i>
                                                    </button>
                                                    <label for="password-input">Password</label>
                                                </div>
                                                <div class="mb-3 d-flex justify-content-between align-items-center">
                                                    <div class="form-check form-check-primary  py-1">
                                                        <input class="form-check-input" type="checkbox" id="remember-check">
                                                        <label class="form-check-label ms-2" for="remember-check">
                                                            Remember me
                                                        </label>
                                                    </div>
                                                    <div class="">
                                                        <a href="forgotpassword.html" class="">Can’t access you account?</a>
                                                    </div>
                                                </div>
                                                <div class="">
                                                    <button class="btn btn-secondary w-100" type="submit">Log In</button>
                                                </div>
                                            </form>
                                            <footer class="text-center">
                                                <p class="text-muted mb-0">Don’t have an account?<a href="#" class="ms-1"><b>Sign Up</b></a></p>
                                            </footer>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!-- JAVASCRIPT -->
    <script src="assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
    <!-- lucide icon js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
